<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>London Explorer & Greggs Radar</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app-container { display: flex; flex-direction: column; height: 100vh; }

    /* Top Control Bar */
    #controls {
      background: #1e293b;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    #search-box {
      flex: 1 1 180px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    #category-select {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    
    /* Type Filter Checkboxes */
    .filter-type-group {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      font-size: 13px;
    }
    .filter-type-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }
    .filter-type-label input[type="checkbox"] {
      cursor: pointer;
      accent-color: #2563eb;
      width: 15px;
      height: 15px;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:active { background: #1d4ed8; }

    /* Content Area */
    #main-content { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: 330px;
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 500;
    }
    #sidebar-header {
      padding: 12px 16px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #sidebar-list { list-style: none; }
    .sidebar-item {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .sidebar-item:hover { background: #e2e8f0; }
    .sidebar-title { font-size: 14px; font-weight: 600; color: #0f172a; margin-bottom: 4px; }
    .sidebar-sub { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .badge-container { display: flex; gap: 6px; align-items: center; }
    .sidebar-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      text-transform: uppercase;
    }
    .badge-requested { background-color: #475569; }
    .badge-suggested { background-color: #0284c7; }

    #map { flex: 1; width: 100%; height: 100%; }

    /* SVG Pin Styling */
    .custom-svg-pin { background: transparent; border: none; }

    /* Custom Popup Styles */
    .leaflet-popup-content-wrapper { border-radius: 8px; padding: 4px; max-width: 310px; }
    .popup-title-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; gap: 8px; }
    .popup-title { font-weight: 700; font-size: 15px; color: #0f172a; }
    .popup-cat { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .popup-row { font-size: 12px; color: #334155; margin-bottom: 4px; line-height: 1.4; }
    .popup-row strong { color: #0f172a; }
    .popup-link { margin-top: 8px; font-size: 12px; font-weight: 600; }
    .popup-link a { color: #2563eb; text-decoration: none; }

    /* Mobile Responsiveness */
    @media (max-width: 640px) {
      #main-content { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 220px; border-right: none; border-top: 1px solid #e2e8f0; }
      #controls { gap: 6px; }
      .filter-type-group { width: 100%; justify-content: space-around; }
    }
  </style>
</head>

<div id="app-container">
  <div id="controls">
    <input type="text" id="search-box" placeholder="Search locations..." onkeyup="filterMarkers()" />
    
    <select id="category-select" onchange="filterMarkers()">

      <option value="Themed Tea">Themed Afternoon Tea</option>
      <option value="Photo Spots">Photo & Public Art</option>
      <option value="Greggs">Greggs Radar</option>
    </select>

    <!-- Classification Checkbox Filter (Placed between Category Dropdown & Find Closest) -->
    <div class="filter-type-group">
      <label class="filter-type-label">
        <input type="checkbox" id="chk-requested" checked onchange="filterMarkers()" /> Requested
      </label>
      <label class="filter-type-label">
        <input type="checkbox" id="chk-suggested" checked onchange="filterMarkers()" /> Suggested
      </label>
    </div>

    <button class="btn" onclick="locateUser()">📍 Find Closest</button>
  </div>

  <div id="main-content">
    <div id="sidebar">
      <div id="sidebar-header">Locations Shown (<span id="location-count">0</span>)</div>
      <ul id="sidebar-list"></ul>
    </div>
    <div id="map"></div>
  </div>
</div>

  // Automatic Fallback Data Generator
  function getFormattedLoc(loc) {
    return {
      name: loc.name,
      cat: loc.cat,
      type: loc.type || "Requested",
      lat: loc.lat,
      lng: loc.lng,
      neighborhood: loc.neighborhood || "Central London",
      address: loc.address || `${loc.name}, London, UK`,
      setting: loc.setting || "Indoors / Walk-in",
      reservations: loc.reservations || "Walk-ins welcome (No booking needed)",
      tube: loc.tube || "Nearby Tube Station",
      hours: loc.hours || "Mon–Sat 10:00 AM–11:00 PM, Sun 12:00 PM–10:00 PM",
      bestTime: loc.bestTime || "Off-peak hours (2:00 PM–4:00 PM)",
      worstTime: loc.worstTime || "Peak rush hours (12:00 PM–2:00 PM & 6:00 PM–8:00 PM)",
      specialty: loc.specialty || ""
    };
  }

  let markerStore = [];
  let userMarker = null;

  // Render Markers & Initial Sidebar
  function loadMarkers() {
    rawLocations.forEach(raw => {
      const loc = getFormattedLoc(raw);
      const pinColor = categoryColors[loc.cat] || '#3b82f6';
      const customIcon = createPinIcon(pinColor);

      const m = L.marker([loc.lat, loc.lng], { icon: customIcon }).addTo(map);

      // Type Badge HTML for Popup Header
      const typeBadgeClass = loc.type === "Suggested" ? "badge-suggested" : "badge-requested";

      // Construct Popup HTML with all structured fields
      let popupHTML = `
        <div class="popup-title-container">
          <div class="popup-title">${loc.name}</div>
          <span class="sidebar-badge ${typeBadgeClass}">${loc.type}</span>
        </div>
        <div class="popup-cat" style="color:${pinColor}">${loc.cat} • ${loc.neighborhood}</div>
        <div class="popup-row"><strong>Tube:</strong> ${loc.tube}</div>
        <div class="popup-row"><strong>Setting:</strong> ${loc.setting}</div>
        <div class="popup-row"><strong>Reservations:</strong> ${loc.reservations}</div>
        <div class="popup-row"><strong>Hours:</strong> ${loc.hours}</div>
        <div class="popup-row"><strong>Best Time:</strong> ${loc.bestTime}</div>
        <div class="popup-row"><strong>Worst Time:</strong> ${loc.worstTime}</div>
      `;

      if (loc.specialty) {
        popupHTML += `<div class="popup-row"><strong>Specialty / Feature:</strong> ${loc.specialty}</div>`;
      }

      popupHTML += `<div class="popup-link"><a href="https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}" target="_blank">🗺️ Open Directions in Google Maps</a></div>`;

      m.bindPopup(popupHTML);
      markerStore.push({ marker: m, data: loc, color: pinColor });
    });

    updateSidebar(markerStore);
  }

  // Update Dynamic Sidebar
  function updateSidebar(visibleItems) {
    const listEl = document.getElementById('sidebar-list');
    const countEl = document.getElementById('location-count');
    listEl.innerHTML = '';
    countEl.textContent = visibleItems.length;

    visibleItems.forEach(item => {
      const li = document.createElement('li');
      li.className = 'sidebar-item';
      
      const typeBadgeClass = item.data.type === "Suggested" ? "badge-suggested" : "badge-requested";

      li.innerHTML = `
        <div class="sidebar-title">${item.data.name}</div>
        <div class="sidebar-sub">📍 ${item.data.neighborhood} | 🚇 ${item.data.tube.split('(')[0]}</div>
        <div class="badge-container">
          <span class="sidebar-badge" style="background-color: ${item.color}">${item.data.cat}</span>
          <span class="sidebar-badge ${typeBadgeClass}">${item.data.type}</span>
        </div>
      `;
      li.onclick = () => {
        map.setView([item.data.lat, item.data.lng], 16);
        item.marker.openPopup();
      };
      listEl.appendChild(li);
    });
  }

  // Filter Markers & Sidebar based on Search, Category, AND Requested/Suggested Checkboxes
  function filterMarkers() {
    const searchVal = document.getElementById('search-box').value.toLowerCase();
    const catVal = document.getElementById('category-select').value;
    const showRequested = document.getElementById('chk-requested').checked;
    const showSuggested = document.getElementById('chk-suggested').checked;
    
    const visibleItems = [];

    markerStore.forEach(item => {
      const matchesSearch = item.data.name.toLowerCase().includes(searchVal) || 
                            item.data.neighborhood.toLowerCase().includes(searchVal) ||
                            item.data.tube.toLowerCase().includes(searchVal);
      
      const matchesCat = (catVal === 'ALL') || (item.data.cat === catVal);
      
      const matchesType = (item.data.type === 'Requested' && showRequested) || 
                          (item.data.type === 'Suggested' && showSuggested);

      if (matchesSearch && matchesCat && matchesType) {
        if (!map.hasLayer(item.marker)) map.addLayer(item.marker);
        visibleItems.push(item);
      } else {
        if (map.hasLayer(item.marker)) map.removeLayer(item.marker);
      }
    });

    updateSidebar(visibleItems);
  }

  // Locate User GPS
  function locateUser() {
    if (!navigator.geolocation) {
      alert("Geolocation is not supported by your browser.");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const uLat = pos.coords.latitude;
        const uLng = pos.coords.longitude;

        if (userMarker) map.removeLayer(userMarker);

        userMarker = L.circleMarker([uLat, uLng], {
          radius: 9,
          fillColor: '#2563eb',
          color: '#ffffff',
          weight: 3,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map).bindPopup("<b>You Are Here</b>").openPopup();

        let closest = null;
        let minDistance = Infinity;

        markerStore.forEach(item => {
          if (map.hasLayer(item.marker)) {
            const loc = item.data;
            const dist = map.distance([uLat, uLng], [loc.lat, loc.lng]);
            if (dist < minDistance) {
              minDistance = dist;
              closest = loc;
            }
          }
        });

        if (closest) {
          map.setView([uLat, uLng], 15);
          alert(`Nearest visible spot is "${closest.name}" (${Math.round(minDistance)} meters away).`);
        } else {
          map.setView([uLat, uLng], 14);
        }
      },
      () => alert("Unable to retrieve your current location. Please check GPS permissions.")
    );
  }

  loadMarkers();
